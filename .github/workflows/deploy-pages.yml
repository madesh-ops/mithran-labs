name: Deploy to GitHub Pages

# Builds a static export of the site and publishes it to GitHub Pages on every
# push to main (and on demand from the Actions tab).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # GitHub Pages serves static files only: drop the contact form's server
      # route (/api/contact) and Cache Components-only config for this build.
      # Every other build keeps them. See scripts/prepare-pages.mjs.
      - name: Prepare static export
        run: node scripts/prepare-pages.mjs

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      # Static-host fixes: flat prefetch payload names, and .nojekyll so Pages
      # serves /_next. See scripts/finalize-pages.mjs.
      - name: Finalize static export
        run: node scripts/finalize-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
